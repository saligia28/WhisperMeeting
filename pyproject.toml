[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whispermeeting"
version = "0.1.0"
description = "Local-first meeting assistant pipeline with Whisper transcription and LLM summarisation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Whisper Meeting Team"}
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "pydantic>=2.6",
    "faster-whisper>=0.9",
    "transformers>=4.39",
    "torch>=2.2",
    "jinja2>=3.1",
    "sqlmodel>=0.0.16",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyannote.audio>=3.0",
    "python-multipart>=0.0.9",
    "psutil>=5.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "httpx>=0.27",
    "ruff>=0.3"
]

[tool.setuptools.packages.find]
where = ["src"]
